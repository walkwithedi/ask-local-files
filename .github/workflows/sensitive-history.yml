name: sensitive-history
# Weekly scan of all of history, every branch and tag: lines added and later removed, commit
# messages, author and committer e-mails, image and document metadata (scripts/sensitive_scan.py
# --history), and credentials (gitleaks). A finding here cannot be fixed by a new commit; see
# SECURITY.md, "Something sensitive reached the repository".
# The failure e-mail goes to whoever last changed the schedule below.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    env:
      SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
      GITLEAKS_VERSION: v8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every branch and tag
        run: git fetch --quiet --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sensitive data (all of history)
        run: python scripts/sensitive_scan.py --history
      - name: Credentials (gitleaks, all of history)
        if: always()
        run: |
          go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts=--all .
