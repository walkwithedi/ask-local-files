name: scorecard
# OpenSSF Scorecard: checks supply-chain practices (branch protection, pinned actions,
# token permissions, ...) and reports them under Security > Code scanning.
# Needs a public repository.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    # publishes results only for a public repository; runs once the repository is public
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
